name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "::error title=Prerelease tag::The VS Code Marketplace does not accept semver prerelease versions like $VERSION."
              exit 1
              ;;
          esac
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error title=Missing changelog::CHANGELOG.md has no ## [$VERSION] section."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx vsce package --out extension.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: extension.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install publishing tools
        run: npm ci --ignore-scripts

      - name: Download VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice title=Open VSX::OVSX_PAT is not set - skipping."
            exit 0
          fi
          npx ovsx publish extension.vsix --skip-duplicate

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice title=VS Code Marketplace::VSCE_PAT is not set - skipping."
            exit 0
          fi
          npx vsce publish --packagePath extension.vsix --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=GitHub Release::$TAG already exists - skipping."
            exit 0
          fi
          VERSION="${TAG#v}"
          NAME=$(node -p "require('./package.json').name")
          VSIX="${NAME}-${VERSION}.vsix"
          cp extension.vsix "$VSIX"
          awk -v hdr="## [$VERSION]" 'index($0, hdr)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" "$VSIX" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes
          fi
          echo "Created GitHub Release $TAG."
